services:
  - type: web
    name: anveshak-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: URLSCAN_API_KEY
        sync: false
      - key: IPGEOLOCATION_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: '["https://anveshak.vercel.app","http://localhost:5173"]'
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
